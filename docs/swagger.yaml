info:
  contact:
    email: support@sea-shell.no
    name: API Support
  description: This is the API of GoGear
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: GoGear API
  version: "1.0"
paths:
  /api/v1/category/{category}/delete:
    delete:
      consumes:
      - application/json
      description: Delete category with corresponding ID value. Requires a JWT issued
        with the admin audience.
      parameters:
      - description: Unique ID of category you want to update
        in: path
        name: category
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete category with ID
      tags:
      - Category
  /api/v1/category/{category}/get:
    get:
      consumes:
      - application/json
      description: Get category spessific to ID. category_container is the explicit
        container setting (container, not_container, or inherit when the sub-category
        has none); category_is_container is the effective setting (BR-021).
      parameters:
      - description: Unique ID of category you want to get
        in: path
        name: category
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: desc
          schema:
            $ref: '#/definitions/models.GearCategory'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Get category with ID
      tags:
      - Category
  /api/v1/category/{category}/update:
    post:
      consumes:
      - application/json
      description: 'Update category identified by ID. Requires a JWT issued with the
        admin audience. category_container sets the container setting: "container"
        or "not_container" sets it, "inherit" removes it so the top category''s setting
        applies; absent or null leaves it unchanged; any other value is 400. category_is_container
        is read-only and ignored.'
      parameters:
      - description: Unique ID of category you want to update
        in: path
        name: categoryID
        required: true
        type: integer
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "403":
          description: admin privileges required
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Update category with ID
      tags:
      - Category
  /api/v1/category/insert:
    put:
      consumes:
      - application/json
      description: Insert new category with corresponding values. Requires a JWT issued
        with the admin audience. Without category_container (or with null or "inherit")
        the new sub-category has no explicit container setting and follows its top
        category.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: the created category with its container settings
          schema:
            $ref: '#/definitions/models.GearCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "403":
          description: admin privileges required
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Insert new category
      tags:
      - Category
  /api/v1/category/list:
    get:
      consumes:
      - application/json
      description: Get a list of category items, each with its explicit (category_container)
        and effective (category_is_container) container setting and its top category's
        (top_category_is_container).
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - collectionFormat: multi
        description: Top category
        in: query
        items:
          type: integer
        name: category
        type: array
      - collectionFormat: multi
        description: Top gear category
        in: query
        items:
          type: integer
        name: topCategory
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.GearCategoryListItem'
                  type: array
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - Category
  /api/v1/container/{container}/delete:
    delete:
      consumes:
      - application/json
      description: Delete user container content with corresponding ID value
      parameters:
      - description: Unique ID of userGear you want to update
        in: path
        name: container
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete user container content with ID
      tags:
      - User container
  /api/v1/container/{container}/list:
    get:
      consumes:
      - application/json
      description: List all items inside a container registered to a user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Unique ID of userGear you want to update
        in: path
        name: container
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.FullGear'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List all items inside a container
      tags:
      - User container
  /api/v1/container/insert:
    put:
      consumes:
      - application/json
      description: 'Put one of the caller''s registrations inside another. Any registration
        can be content, at any depth, but only a registration whose gear is container-capable
        (its sub-category is a container category) can hold items; otherwise the request
        is refused with 409. A registration has at most one direct container and cannot
        end up inside itself: a second container or a cycle is refused with 409, a
        link to itself with 400, and a foreign or unknown registration with 404. Checks
        run in that order: 404, then 400 for a self-link, then the not-capable 409,
        then the other 409s.'
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserContainerNoID'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: the container registration cannot hold items (its gear is not
            in a container category), or the content already has a container, or the
            link would make a cycle
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Insert user registered gear
      tags:
      - User container
  /api/v1/gear/{gear}/delete:
    delete:
      consumes:
      - application/json
      description: Delete gear with corresponding ID value
      parameters:
      - description: Unique ID of gear you want to delete
        in: path
        name: gear
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete gear with ID
      tags:
      - Gear
  /api/v1/gear/{gear}/get:
    get:
      consumes:
      - application/json
      description: Get gear spessific to ID
      parameters:
      - description: Unique ID of Gear you want to get
        in: path
        name: gear
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: desc
          schema:
            $ref: '#/definitions/models.FullGear'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Get gear with ID
      tags:
      - Gear
  /api/v1/gear/{gear}/update:
    post:
      consumes:
      - application/json
      description: Update gear identified by ID
      parameters:
      - description: Unique ID of Gear you want to get
        in: path
        name: gear
        required: true
        type: integer
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Update gear with ID
      tags:
      - Gear
  /api/v1/gear/insert:
    put:
      consumes:
      - application/json
      description: 'Insert new gear with corresponding values. gear_is_container is
        read-only: it is ignored when sent, and the response reports the status derived
        from the gear''s sub-category.'
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearInput'
      produces:
      - application/json
      responses:
        "200":
          description: the created gear
          schema:
            $ref: '#/definitions/models.Gear'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Insert new gear
      tags:
      - Gear
  /api/v1/gear/list:
    get:
      consumes:
      - application/json
      description: Get a list of gear items
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Gear category
        in: query
        name: category
        type: string
      - description: Top gear category
        in: query
        name: topCategory
        type: string
      - description: Gear manufacturer
        in: query
        name: manufacturer
        type: string
      - collectionFormat: multi
        description: string collection
        in: query
        items:
          type: string
        name: collection
        type: array
      - default: false
        description: string collection
        in: query
        name: container
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.GearListItem'
                  type: array
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: List gear
      tags:
      - Gear
  /api/v1/gear/search:
    get:
      consumes:
      - application/json
      description: Get a list of gear items based on search patterns
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: String to search for
        in: query
        name: searchString
        required: true
        type: string
      - description: 'Type of search method. valid choices are: startswith, contains,
          endswith'
        in: query
        name: searchType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.GearListItem'
                  type: array
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Search for gear
      tags:
      - Gear
  /api/v1/loadout/{loadout}/delete:
    delete:
      consumes:
      - application/json
      description: Delete a loadout and its items. Unknown and other users' loadouts
        both return 404.
      parameters:
      - description: Loadout ID
        in: path
        name: loadout
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete loadout
      tags:
      - Loadouts
  /api/v1/loadout/{loadout}/get:
    get:
      consumes:
      - application/json
      description: Get a single loadout by ID. Unknown and other users' loadouts both
        return 404.
      parameters:
      - description: Loadout ID
        in: path
