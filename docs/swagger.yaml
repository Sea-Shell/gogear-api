        required: true
        type: integer
      - description: Place ID
        in: path
        name: place
        required: true
        type: integer
      - description: parent_place_id (number or null, required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoadoutPlaceUpdate'
