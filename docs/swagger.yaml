      consumes:
      - application/json
      description: Update the loadout named in the path. Only fields present in the
        body change. A loadout_id or user_id in the body that differs from the path
        or the caller is refused with 400. stage (planning, packing or done) can change
        from any stage to any other; setting done when the loadout is not done stores
        the time as done_at, setting done again keeps it, and any other stage clears
        it. Nothing else ever changes the stage. start_date and end_date (YYYY-MM-DD)
        and weight_goal (whole grams, at least 1) can be set, changed, and removed
        with null; an invalid value, an unknown stage, or an end_date before the start_date
        (judged on the values after the update) is 400 and changes nothing. Being
        over the goal is never refused.
