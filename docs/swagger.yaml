definitions:
  endpoints.googleCallbackRequest:
    properties:
      code:
        type: string
      credential:
        type: string
      id_token:
        type: string
    type: object
  models.ClosedPlace:
    properties:
      name:
        type: string
      place_id:
        type: integer
      place_kind:
        type: string
    type: object
  models.Error:
    properties:
      error:
        type: string
    type: object
  models.FullGear:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      category_top_category_id:
        type: integer
      gear_category_id:
        type: integer
      gear_height:
        type: integer
      gear_id:
        type: integer
      gear_is_container:
        readOnly: true
        type: boolean
      gear_length:
        type: integer
      gear_manufacture_id:
        type: integer
      gear_name:
        type: string
      gear_size_definition:
        type: string
      gear_status:
        type: boolean
      gear_top_category_id:
        type: integer
      gear_weight:
        type: integer
      gear_width:
        type: integer
      manufacture_id:
        type: integer
      manufacture_name:
        type: string
      top_category_icon:
        type: string
      top_category_id:
        type: integer
      top_category_name:
        type: string
    type: object
  models.Gear:
    properties:
      gear_category_id:
        type: integer
      gear_height:
        type: integer
      gear_id:
        type: integer
      gear_is_container:
        readOnly: true
        type: boolean
      gear_length:
        type: integer
      gear_manufacture_id:
        type: integer
      gear_name:
        type: string
      gear_size_definition:
        type: string
      gear_status:
        type: boolean
      gear_top_category_id:
        type: integer
      gear_weight:
        type: integer
      gear_width:
        type: integer
    type: object
  models.GearCategory:
    properties:
      category_container:
        enum:
        - container
        - not_container
        - inherit
        type: string
      category_id:
        type: integer
      category_is_container:
        readOnly: true
        type: boolean
      category_name:
        type: string
      category_top_category_id:
        type: integer
    type: object
  models.GearCategoryInput:
    properties:
      category_container:
        enum:
        - container
        - not_container
        - inherit
        type: string
      category_id:
        type: integer
      category_name:
        type: string
      category_top_category_id:
        type: integer
    type: object
  models.GearCategoryListItem:
    properties:
      category_container:
        enum:
        - container
        - not_container
        - inherit
        type: string
      category_id:
        type: integer
      category_is_container:
        readOnly: true
        type: boolean
      category_name:
        type: string
      category_top_category_id:
        type: integer
      top_category_icon:
        type: string
      top_category_id:
        type: integer
      top_category_is_container:
        readOnly: true
        type: boolean
      top_category_name:
        type: string
    type: object
  models.GearInput:
    properties:
      gear_category_id:
        type: integer
      gear_height:
        type: integer
      gear_id:
        type: integer
      gear_length:
        type: integer
      gear_manufacture_id:
        type: integer
      gear_name:
        type: string
      gear_size_definition:
        type: string
      gear_status:
        type: boolean
      gear_top_category_id:
        type: integer
      gear_weight:
        type: integer
      gear_width:
        type: integer
    type: object
  models.GearListItem:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      category_top_category_id:
        type: integer
      gear_category_id:
        type: integer
      gear_id:
        type: integer
      gear_is_container:
        readOnly: true
        type: boolean
      gear_manufacture_id:
        type: integer
      gear_name:
        type: string
      gear_size_definition:
        type: string
      gear_top_category_id:
        type: integer
      gear_weight:
        type: integer
      manufacture_id:
        type: integer
      manufacture_name:
        type: string
      top_category_icon:
        type: string
      top_category_id:
        type: integer
      top_category_name:
        type: string
    type: object
  models.GearTopCategory:
    properties:
      top_category_icon:
        type: string
      top_category_id:
        type: integer
      top_category_is_container:
        description: |-
          TopCategoryIsContainer is the top category's container setting (BR-021).
          Absent or null on create means false; absent or null on update means
          unchanged.
        type: boolean
      top_category_name:
        type: string
    type: object
  models.Health:
    properties:
      documentation:
        type: string
      name:
        type: string
      status:
        type: string
      updated:
        type: string
    type: object
  models.Loadout:
    properties:
      bag_count:
        type: integer
      closed_places:
        description: 'ClosedPlaces is never nil: it encodes as [] when no place is
          closed.'
        items:
          $ref: '#/definitions/models.ClosedPlace'
        type: array
      created_at:
        type: string
      done_at:
        type: string
      end_date:
        type: string
      item_count:
        type: integer
      loadout_description:
        type: string
      loadout_id:
        type: integer
      loadout_is_public:
        type: boolean
      loadout_name:
        type: string
      loadout_slug:
        type: string
      stage:
        description: |-
          Stage is "planning", "packing" or "done" (BR-028). DoneAt is when the
          loadout was last set to done, and null unless Stage is "done". StartDate
          and EndDate are calendar dates (YYYY-MM-DD) and WeightGoal is the target
          on-your-back weight in grams; each is null when not set.
        enum:
        - planning
        - packing
        - done
        type: string
      start_date:
        type: string
      ticked_count:
        type: integer
      total_weight:
        description: |-
          TotalWeight is the on-your-back weight in grams: an exact JSON integer
          that can exceed 2^63-1, never quoted or fractional. JavaScript's
          JSON.parse rounds an integer above 2^53.
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      weight_goal:
        type: integer
    type: object
  models.LoadoutCopyRequest:
    properties:
      copy_notes_and_goal:
        description: |-
          CopyNotesAndGoal copies the loadout description, the weight goal and each
          item's notes. Off: none of them.
        type: boolean
      copy_places:
        description: |-
          CopyPlaces copies Last minute, the bags with their nesting and order, and
          each item's place. Off: the copy has no bags, no Last minute and no item
          has a place.
        type: boolean
      loadout_name:
        type: string
    required:
    - copy_notes_and_goal
    - copy_places
    - loadout_name
    type: object
  models.LoadoutCopyResult:
    properties:
      left_out:
        items:
          $ref: '#/definitions/models.LoadoutLeftOutItem'
        type: array
      loadout:
        $ref: '#/definitions/models.Loadout'
    type: object
  models.LoadoutFull:
    properties:
      items:
        items:
          $ref: '#/definitions/models.LoadoutItem'
        type: array
      loadout:
        $ref: '#/definitions/models.Loadout'
      places:
        items:
          $ref: '#/definitions/models.LoadoutPlace'
        type: array
    type: object
  models.LoadoutItem:
    properties:
      catalog_weight:
        type: integer
      category_name:
        type: string
      closet_count:
        type: integer
      consumable:
        description: |-
          Consumable is this item's role in this loadout (food, water or fuel,
          BR-027). It belongs to the item, not to its registration.
        type: boolean
      detached_reason:
        type: string
      gear_id:
        description: |-
          GearID is read-only: the registration's gear, else the detached gear. It
          is null only for a deleted registration whose gear was already missing.
        type: integer
      gear_name:
        description: |-
          Names are read live from the current gear, except for an item whose
          registration was deleted: its gear_name is the snapshot and the other
          names are null.
        type: string
      loadout_id:
        type: integer
      loadout_item_id:
        type: integer
      manufacture_name:
        type: string
      measured_weight:
        description: |-
          The registration's own weight and count, read live (BR-026, BR-036). All
          three are null for an item with no registration (legacy or deleted): it
          reports only unit_weight and weight_source, as they were or as the
          catalog has them.
        type: integer
      measured_weight_source:
        type: string
      notes:
        type: string
      place_id:
        type: integer
      quantity:
        type: integer
      registration_exists:
        type: boolean
      ticked:
        type: boolean
      top_category_name:
        type: string
      unit_weight:
        type: integer
      usergear_registration_id:
        type: integer
      weight_source:
        type: string
    type: object
  models.LoadoutItemNoID:
    properties:
      consumable:
        type: boolean
      gear_id:
        type: integer
      loadout_id:
        type: integer
      notes:
        type: string
      place_id:
        type: integer
      quantity:
        type: integer
      usergear_registration_id:
        type: integer
    type: object
  models.LoadoutItemPublic:
    properties:
      gear_id:
        type: integer
      gear_name:
        type: string
      loadout_id:
        type: integer
      loadout_item_id:
        type: integer
      notes:
        type: string
      quantity:
        type: integer
    type: object
  models.LoadoutItemTick:
    properties:
      ticked:
        type: boolean
    type: object
  models.LoadoutItemTickResult:
    properties:
      loadout_item_id:
        type: integer
      ticked:
        type: boolean
    type: object
  models.LoadoutItemUpdate:
    properties:
      consumable:
        type: boolean
      loadout_item_id:
        type: integer
      notes:
        type: string
      place_id:
        type: integer
      quantity:
        type: integer
    type: object
  models.LoadoutLeftOutItem:
    properties:
      gear_name:
        type: string
      loadout_item_id:
        type: integer
    type: object
  models.LoadoutNoID:
    properties:
      end_date:
        format: date
        type: string
      loadout_description:
        type: string
      loadout_is_public:
        type: boolean
      loadout_name:
        type: string
      loadout_slug:
        type: string
      start_date:
        format: date
        type: string
      user_id:
        type: integer
      weight_goal:
        minimum: 1
        type: integer
    type: object
  models.LoadoutPlace:
    properties:
      catalog_weight:
        type: integer
      closed:
        type: boolean
      gear_id:
        type: integer
      gear_is_container:
        type: boolean
      gear_name:
        type: string
      loadout_id:
        type: integer
      max_container_weight:
        type: integer
      measured_weight:
        description: The bag registration's own weight, null when it has none (BR-026).
        type: integer
      measured_weight_source:
        type: string
      parent_place_id:
        type: integer
      place_id:
        type: integer
      place_kind:
        description: '"worn", "last_minute" or "bag"'
        type: string
      position:
        type: integer
      unit_weight:
        type: integer
      usergear_registration_id:
        type: integer
      weight_source:
        type: string
    type: object
  models.LoadoutPlaceClose:
    properties:
      closed:
        type: boolean
    type: object
  models.LoadoutPlaceCloseResult:
    properties:
      closed:
        type: boolean
      place_id:
        type: integer
    type: object
  models.LoadoutPlaceInsert:
    properties:
      parent_place_id:
        type: integer
      place_kind:
        type: string
      usergear_registration_id:
        type: integer
    type: object
  models.LoadoutPlaceOrder:
    properties:
      place_ids:
        items:
          type: integer
        type: array
    type: object
  models.LoadoutPlaceUpdate:
    properties:
      parent_place_id:
        type: integer
    type: object
  models.LoadoutPublic:
    properties:
      created_at:
        type: string
      loadout_description:
        type: string
      loadout_id:
        type: integer
      loadout_name:
        type: string
      loadout_slug:
        type: string
      total_weight:
        description: |-
          TotalWeight is the on-your-back weight in grams: an exact JSON integer
          that can exceed 2^63-1, never quoted or fractional. JavaScript's
          JSON.parse rounds an integer above 2^53.
        type: integer
      updated_at:
        type: string
    type: object
  models.LoadoutUpdate:
    properties:
      end_date:
        format: date
        type: string
      loadout_description:
        type: string
      loadout_id:
        type: integer
      loadout_is_public:
        type: boolean
      loadout_name:
        type: string
      loadout_slug:
        type: string
      stage:
        enum:
        - planning
        - packing
        - done
        type: string
      start_date:
        format: date
        type: string
      weight_goal:
        minimum: 1
        type: integer
    type: object
  models.Manufacture:
    properties:
      manufacture_id:
        type: integer
      manufacture_name:
        type: string
    type: object
  models.ResponsePayload:
    properties:
      current_page:
        type: integer
      item_limit:
        type: integer
      items: {}
      next_page:
        type: string
      prev_page:
        type: string
      total_item_count:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Status:
    properties:
      status:
        type: string
    type: object
  models.User:
    properties:
      user_email:
        type: string
      user_id:
        type: integer
      user_is_admin:
        type: boolean
      user_name:
        type: string
      user_username:
        type: string
    type: object
  models.UserContainerNoID:
    properties:
      user_container_id:
        type: integer
      user_gear_registration_id:
        type: integer
    type: object
  models.UserGear:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      category_top_category_id:
        type: integer
      closet_count:
        type: integer
      container_link_id:
        type: integer
      container_registration_id:
        type: integer
      gear_category_id:
        type: integer
      gear_height:
        type: integer
      gear_id:
        type: integer
      gear_is_container:
        readOnly: true
        type: boolean
      gear_length:
        type: integer
      gear_manufacture_id:
        type: integer
      gear_name:
        type: string
      gear_status:
        type: boolean
      gear_top_category_id:
        type: integer
      gear_weight:
        type: integer
      gear_width:
        type: integer
      manufacture_id:
        type: integer
      manufacture_name:
        type: string
      max_container_weight:
        type: integer
      measured_weight:
        description: |-
          The owner's own weight with its source ("weighed" or "guess"), both null
          when none (BR-026). UnitWeight and WeightSource are the effective values
          every loadout uses: the measured weight, else the catalog weight with
          source "catalog", else null with source "none". ClosetCount is how many
          identical items the registration stands for (BR-036); it never multiplies
          a weight.
        type: integer
      measured_weight_source:
        type: string
      top_category_icon:
        type: string
      top_category_id:
        type: integer
      top_category_name:
        type: string
      unit_weight:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
      user_username:
        type: string
      usergear_gear_id:
        type: integer
      usergear_registration_id:
        type: integer
      usergear_user_id:
        type: integer
      weight_source:
        type: string
    type: object
  models.UserGearLink:
    properties:
      closet_count:
        type: integer
      max_container_weight:
        type: integer
      measured_weight:
        type: integer
      measured_weight_source:
        enum:
        - weighed
        - guess
        type: string
      usergear_gear_id:
        type: integer
      usergear_registration_id:
        type: integer
      usergear_user_id:
        type: integer
    type: object
  models.UserGearLinkNoID:
    properties:
      closet_count:
        type: integer
      max_container_weight:
        type: integer
      measured_weight:
        type: integer
      measured_weight_source:
        enum:
        - weighed
        - guess
        type: string
      usergear_gear_id:
        type: integer
      usergear_user_id:
        type: integer
    type: object
info:
  contact:
    email: support@sea-shell.no
    name: API Support
  description: This is the API of GoGear
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: GoGear API
  version: "1.0"
paths:
  /api/v1/category/{category}/delete:
    delete:
      consumes:
      - application/json
      description: Delete category with corresponding ID value. Requires a JWT issued
        with the admin audience.
      parameters:
      - description: Unique ID of category you want to update
        in: path
        name: category
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete category with ID
      tags:
      - Category
  /api/v1/category/{category}/get:
    get:
      consumes:
      - application/json
      description: Get category spessific to ID. category_container is the explicit
        container setting (container, not_container, or inherit when the sub-category
        has none); category_is_container is the effective setting (BR-021).
      parameters:
      - description: Unique ID of category you want to get
        in: path
        name: category
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: desc
          schema:
            $ref: '#/definitions/models.GearCategory'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Get category with ID
      tags:
      - Category
  /api/v1/category/{category}/update:
    post:
      consumes:
      - application/json
      description: 'Update category identified by ID. Requires a JWT issued with the
        admin audience. category_container sets the container setting: "container"
        or "not_container" sets it, "inherit" removes it so the top category''s setting
        applies; absent or null leaves it unchanged; any other value is 400. category_is_container
        is read-only and ignored.'
      parameters:
      - description: Unique ID of category you want to update
        in: path
        name: categoryID
        required: true
        type: integer
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "403":
          description: admin privileges required
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Update category with ID
      tags:
      - Category
  /api/v1/category/insert:
    put:
      consumes:
      - application/json
      description: Insert new category with corresponding values. Requires a JWT issued
        with the admin audience. Without category_container (or with null or "inherit")
        the new sub-category has no explicit container setting and follows its top
        category.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GearCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: the created category with its container settings
          schema:
            $ref: '#/definitions/models.GearCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "403":
          description: admin privileges required
          schema:
            $ref: '#/definitions/models.Error'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Insert new category
      tags:
      - Category
  /api/v1/category/list:
    get:
      consumes:
      - application/json
      description: Get a list of category items, each with its explicit (category_container)
        and effective (category_is_container) container setting and its top category's
        (top_category_is_container).
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - collectionFormat: multi
        description: Top category
        in: query
        items:
          type: integer
        name: category
        type: array
      - collectionFormat: multi
        description: Top gear category
        in: query
        items:
          type: integer
        name: topCategory
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.GearCategoryListItem'
                  type: array
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - Category
  /api/v1/container/{container}/delete:
    delete:
      consumes:
      - application/json
      description: Delete user container content with corresponding ID value
      parameters:
      - description: Unique ID of userGear you want to update
        in: path
        name: container
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        default:
          description: ""
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Delete user container content with ID
      tags:
      - User container
  /api/v1/container/{container}/list:
    get:
      consumes:
      - application/json
      description: List all items inside a container registered to a user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 30
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Unique ID of userGear you want to update
        in: path
        name: container
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponsePayload'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.FullGear'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List all items inside a container
      tags:
      - User container
  /api/v1/container/insert:
    put:
      consumes:
      - application/json
      description: 'Put one of the caller''s registrations inside another. Any registration
        can be content, at any depth, but only a registration whose gear is container-capable
        (its sub-category is a container category) can hold items; otherwise the request
        is refused with 409. A registration has at most one direct container and cannot
        end up inside itself: a second container or a cycle is refused with 409, a
        link to itself with 400, and a foreign or unknown registration with 404. Checks
        run in that order: 404, then 400 for a self-link, then the not-capable 409,
        then the other 409s.'
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserContainerNoID'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: success when all goes well'
          schema:
            $ref: '#/definitions/models.Status'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: the container registration cannot hold items (its gear is not
            in a container category), or the content already has a container, or the
            link would make a cycle
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - BearerAuth: []
      summary: Insert user registered gear
      tags:
      - User container
