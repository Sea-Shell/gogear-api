  /api/v1/loadout/{loadout}/item/insert:
    put:
      consumes:
      - application/json
      description: 'Add one of the caller''s gear registrations to a loadout, optionally
        into a place (Worn, Last minute or a bag of the loadout). quantity defaults
        to 1; zero or negative is refused with 400. A loadout_id in the body that
        differs from the path is refused with 400. Deprecated legacy path (until the
        cutover, ADR-004 D-2): gear_id instead of usergear_registration_id binds the
        item to the caller''s lowest-ID registration of that gear, or keeps it as
        a legacy item that reads the gear live. Sending both is 400. consumable (true
        or false, default false) sets the item''s food, water or fuel role in this
        loadout only; anything else is 400. A foreign or unknown registration or place
        is 404; a place that is a bag whose gear cannot hold items is 409.'
