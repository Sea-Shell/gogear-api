    put:
      consumes:
      - application/json
      description: 'Create a new loadout for the authenticated user. The owner is
        always the caller; a different user_id in the body is refused with 400. A
        blank slug is stored as no slug. A new loadout is always in stage planning:
        stage may be left out, null or \"planning\", any other value is 400. It has
        no done_at. start_date and end_date (YYYY-MM-DD) and weight_goal (whole grams,
        at least 1) are optional; null is the same as absent. An invalid date or goal,
