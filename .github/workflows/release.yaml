name: "Build Push and Deploy main"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

env:
  IMAGE_REGISTRY: docker.io
  IMAGE_REPOSITORY: bateau
  IMAGE_NAME: gogear-api

permissions:
  contents: read

# Releases never overlap and a running release is never cancelled (ADR-002 D-6).
# The group is deliberately not split by event name: a workflow_dispatch on main
# must serialize with push runs, because both can tag and deploy. The cost is
# that a dispatch may replace a pending push run; it then covers the same
# commits, since a release includes every unreleased commit on main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: nrkno/github-workflow-semantic-release/.github/workflows/workflow.yaml@a68fb147ef99f6622453fc7d2976c295e87ffb1f # v5.1.6
    permissions:
      contents: write # to tag and publish a GitHub release
      pull-requests: read # to read merged pull requests
    with:
      runs-on: ubuntu-latest
      release-enabled: true
      lint-enabled: false
  build:
    runs-on: [ubuntu-latest]
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
    steps:
      - name: Check release tag format
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
      # Checkout repo code
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
      # Docker login/build/push
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        id: build_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}:build-cache
          cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}:build-cache,mode=max,ignore-error=true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
      - name: Check image digest format
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Image digest '$IMAGE_DIGEST' is not sha256:<64 hex>"
            exit 1
          fi
  deploy:
    runs-on: [ubuntu-latest]
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    # 15 min rollout (k8s-deploy) + 3 min wait + setup, with margin.
    timeout-minutes: 25
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      # Checkout repo code
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - name: Kubeconfig context
        uses: azure/k8s-set-context@5f008dfddbbc9df61ba40a7aaa912c6033ba62fc # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_KONFIG }}
      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_ACTION_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_ACTION_CLIENT_SECRET }}
          tags: tag:github
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: 'v1.33.4'
      # The one image reference of this run. k8s-deploy `images:` and the
      # verification below both use it, so they cannot drift apart.
      - name: Compose image reference
        id: image
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
        run: echo "ref=${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:${RELEASE_TAG}@${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
      # Do the deploy on K8s cluster set in the above context
      - name: Deply manifests to k8s
        uses: azure/k8s-deploy@c7ebd0d5f39477a23f1b5dea0f52e6db04adf28e # v6
        timeout-minutes: 15
        with:
          action: deploy
          namespace: seashell
          annotate-namespace: false
          # The repository is private and this job has no registry login; the
          # pull only feeds an annotation (ADR-002 D-11).
          pull-images: false
          strategy: basic
          manifests: kubernetes-manifests
          images: |
            ${{ steps.image.outputs.ref }}
      # Prove the deploy: the Deployment and its one healthy pod name exactly
      # this run's image reference and the pod migrated the database to the
      # highest migration in the tag (ADR-002 D-8, D-11). Every check is
      # reported; the logic and its stub test live in .github/scripts.
      - name: Verify deployed pod
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.ref }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
        run: bash .github/scripts/verify-deployed-pod.sh
