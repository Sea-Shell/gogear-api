apiVersion: apps/v1
kind: Deployment
metadata:
  name: gogear-api
  namespace: seashell
spec:
  replicas: 1
  # One SQLite file on a hostPath: the old pod must stop before the new one
  # starts and migrates, so never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gogear-api
  template:
    metadata:
      labels:
        app: gogear-api
    spec:
      containers:
        - args:
            - --config
            - /config/config.yaml
          env:
            - name: TZ
              value: "Europe/Oslo"
            # Empty on purpose. The release deploy applies this manifest, so an
            # owner's `kubectl set env ... GOGEAR_RESTORE_BACKUP=<file>` is reset
            # to "no request" in the rollout that deploy already does (BR-038).
            - name: GOGEAR_RESTORE_BACKUP
              value: ""
          image: docker.io/bateau/gogear-api:v2.0.0@sha256:ef2711187f057cfa9260223783f49b5657dbbd052b7391683120884ca02d25ee
          imagePullPolicy: Always
          name: gogear-api
          ports:
            - containerPort: 8081
              name: gogear-api
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - mountPath: /config
              name: config
      dnsPolicy: "ClusterFirst"
      securityContext:
        fsGroup: 1000
      volumes:
        - hostPath:
            path: /data/disk2/opt/gogear-api
          name: config
